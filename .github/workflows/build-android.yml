name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify P-12 assets
        shell: bash
        run: |
          test -s app/src/main/assets/P-12.html
          test -s app/src/main/assets/SP1200_HFE_BASE.hfe
          test -s app/src/main/assets/SP1200_HFE_BASE.raw

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: P12-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
